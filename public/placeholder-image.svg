<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
  <!-- Device body -->
  <rect x="75" y="50" width="150" height="400" rx="75" fill="#111" stroke="#222" stroke-width="2"/>
  
  <!-- Camera lens -->
  <circle cx="150" cy="100" r="20" fill="#222" stroke="#333" stroke-width="1"/>
  <circle cx="150" cy="100" r="8" fill="#333"/>
  
  <!-- Display area -->
  <rect x="100" y="150" width="100" height="250" rx="10" fill="#222" stroke="#333" stroke-width="1"/>
  
  <!-- Buttons -->
  <rect x="90" y="220" width="10" height="40" rx="5" fill="#333"/>
  
  <!-- Highlight -->
  <path d="M95 50 L225 50 A75 75 0 0 1 225 100 L95 100 A75 75 0 0 1 95 50" fill="#333" opacity="0.2"/>
  
  <!-- Glow effect -->
  <circle cx="150" cy="250" r="120" fill="url(#glow)" opacity="0.15"/>
  
  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#7d34db" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7d34db" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>